<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  居民端 · 服务大厅（Batch 5）
  数据来源：GET /api/common/categories、/api/common/items、/api/common/items/hot
  写操作：  POST /api/resident/order（受 @RateLimit 限制：60 秒内最多 3 次）
-->
<head th:replace="~{fragments/layout :: head('服务大厅')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('home')}"></aside>
    <div class="app-body">
        <nav th:replace="~{fragments/layout :: topbar('服务大厅')}"></nav>

        <main class="app-main">
            <!-- 顶部欢迎条：说明当前可做的事，并放置搜索框 -->
            <div class="card mb-3" style="border:none;background:linear-gradient(120deg,#0f7c64,#1aa383);color:#fff;">
                <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <div>
                        <div style="font-size:19px;font-weight:700;">需要什么服务，在线约一下</div>
                        <div style="font-size:13px;color:#d5efe7;margin-top:6px;">
                            社区认证师傅上门 · 30 分钟未派单自动取消 · 服务完成后可评价
                        </div>
                    </div>
                    <div class="d-flex gap-2" style="min-width:280px;">
                        <input type="text" class="form-control" id="keyword" placeholder="搜索服务名称，如：疏通、保洁">
                        <button class="btn btn-light" id="searchBtn" style="white-space:nowrap;">
                            <i class="bi bi-search"></i> 搜索
                        </button>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <!-- 左侧：分类筛选 + 服务卡片列表 -->
                <div class="col-lg-9">
                    <div class="card">
                        <div class="card-header">
                            <span>服务分类</span>
                            <span class="sub" id="itemCountHint">加载中…</span>
                        </div>
                        <div class="card-body">
                            <div class="chip-row" id="categoryChips">
                                <span class="text-muted" style="font-size:13px;">分类加载中…</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3" id="itemGrid">
                        <div class="empty-hint"><i class="bi bi-hourglass-split"></i>服务列表加载中…</div>
                    </div>
                    <div class="card mt-3">
                        <div class="cm-pager" id="itemPager"></div>
                    </div>
                </div>

                <!-- 右侧：热门榜（Redis ZSET 热度） + 预约须知 -->
                <div class="col-lg-3">
                    <div class="card">
                        <div class="card-header">
                            <span><i class="bi bi-fire text-danger"></i> 热门服务</span>
                            <span class="sub">下单热度实时累计</span>
                        </div>
                        <div class="card-body p-0" id="hotList">
                            <div class="empty-hint" style="padding:30px 10px;">加载中…</div>
                        </div>
                    </div>
                    <div class="card mt-3">
                        <div class="card-header"><span>预约须知</span></div>
                        <div class="card-body">
                            <div class="hint-box">
                                1. 预约时间需晚于当前时间，最长可选 <strong>30 天</strong> 内；<br>
                                2. 下单后 30 分钟内管理员未派单，系统将<strong>自动取消</strong>；<br>
                                3. 待派单状态可自助取消，已派单需联系物业协调；<br>
                                4. 服务完成后 <strong>7 天内</strong>可评价，逾期入口关闭。
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<!-- ============ 预约下单弹窗 ============ -->
<div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">预约服务</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- 选中项目摘要：由 JS 填充 -->
                <div class="d-flex justify-content-between align-items-start mb-3 p-3"
                     style="background:#f7fbf9;border-radius:10px;">
                    <div>
                        <div style="font-weight:600;font-size:15px;" id="mItemName">-</div>
                        <div style="font-size:12px;color:#6b7d78;margin-top:4px;" id="mItemSkill">-</div>
                    </div>
                    <div class="item-price" id="mItemPrice">-</div>
                </div>
                <form id="orderForm">
                    <input type="hidden" id="mServiceId">
                    <div class="mb-3">
                        <label class="form-label">上门时间 <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" id="mAppointTime" required>
                        <div class="form-text">最早可选 30 分钟后，最晚 30 天内</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">服务地址 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="mAddress" maxlength="128"
                               placeholder="如：康顺社区1号楼2单元101" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">联系电话 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="mPhone" maxlength="20"
                               placeholder="11 位手机号" required>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">备注（选填）</label>
                        <textarea class="form-control" id="mRemark" rows="2" maxlength="255"
                                  placeholder="如：家里有老人，请提前电话联系"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="submitOrderBtn">
                    <i class="bi bi-check2-circle"></i> 提交预约
                </button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:inline="none">
    $(function () {
        /* ================= 页面状态 ================= */
        var state = { pageNum: 1, pageSize: 9, categoryId: null, keyword: '' };
        var categories = [];
        var me = null;
        var orderModal = new bootstrap.Modal(document.getElementById('orderModal'));

        /* ================= 分类筛选 ================= */
        function renderCategories() {
            var html = '<span class="chip' + (state.categoryId === null ? ' active' : '')
                + '" data-cid="">全部服务</span>';
            categories.forEach(function (c) {
                html += '<span class="chip' + (state.categoryId === c.id ? ' active' : '')
                    + '" data-cid="' + c.id + '">' + CM.escapeHtml(c.categoryName)
                    + '<span style="opacity:.65;margin-left:4px;">' + (c.itemCount || 0) + '</span></span>';
            });
            $('#categoryChips').html(html);
        }

        function loadCategories() {
            return CM.get('/api/common/categories').then(function (list) {
                categories = list || [];
                renderCategories();
            });
        }

        $('#categoryChips').on('click', '.chip', function () {
            var cid = $(this).data('cid');
            state.categoryId = cid === '' ? null : Number(cid);
            state.pageNum = 1;
            renderCategories();
            loadItems();
        });

        /* ================= 服务列表 ================= */
        function renderItems(page) {
            var records = page.records || [];
            $('#itemCountHint').text('共 ' + (page.total || 0) + ' 项可预约服务');
            if (!records.length) {
                $('#itemGrid').html('<div class="card"><div class="empty-hint">'
                    + '<i class="bi bi-inbox"></i>没有符合条件的服务，换个分类或关键字试试</div></div>');
                return;
            }
            var html = '<div class="item-grid">';
            records.forEach(function (it) {
                var tags = (it.skillTagsList || []).map(function (t) {
                    return '<span class="tag">' + CM.escapeHtml(t) + '</span>';
                }).join(' ');
                var cover = it.coverImg
                    ? '<img src="' + CM.escapeHtml(it.coverImg) + '" alt="" onerror="this.style.display=\'none\'">'
                    : '';
                html += ''
                    + '<div class="item-card">'
                    + '  <div class="item-cover"><i class="bi bi-tools"></i>' + cover + '</div>'
                    + '  <div class="item-body">'
                    + '    <div class="item-title">' + CM.escapeHtml(it.itemName) + '</div>'
                    + '    <div>' + tags + '</div>'
                    + '    <div class="item-desc">' + CM.escapeHtml(it.description || '暂无详细说明') + '</div>'
                    + '    <div class="d-flex justify-content-between align-items-end mt-auto">'
                    + '      <div class="item-price">¥' + CM.money(it.price)
                    + '        <small>/' + CM.escapeHtml(it.unit || '次') + '</small></div>'
                    + '      <button class="btn btn-primary btn-sm" data-book="' + it.id + '">'
                    + '        <i class="bi bi-calendar-plus"></i> 预约</button>'
                    + '    </div>'
                    + '  </div>'
                    + '</div>';
            });
            html += '</div>';
            $('#itemGrid').html(html);
        }

        function loadItems() {
            CM.get('/api/common/items', {
                pageNum: state.pageNum,
                pageSize: state.pageSize,
                categoryId: state.categoryId,
                keyword: state.keyword
            }).then(function (page) {
                renderItems(page);
                CM.pager($('#itemPager'), page, function (go) {
                    state.pageNum = go;
                    loadItems();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        $('#searchBtn').on('click', doSearch);
        $('#keyword').on('keydown', function (e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });

        function doSearch() {
            state.keyword = $.trim($('#keyword').val());
            state.pageNum = 1;
            loadItems();
        }

        /* ================= 热门榜 ================= */
        function loadHot() {
            CM.get('/api/common/items/hot', { limit: 5 }).then(function (list) {
                if (!list || !list.length) {
                    $('#hotList').html('<div class="empty-hint" style="padding:30px 10px;">暂无热度数据</div>');
                    return;
                }
                var html = '<div style="padding:6px 0;">';
                list.forEach(function (h, idx) {
                    var rankCls = idx === 0 ? 'top1' : '';
                    html += ''
                        + '<div class="d-flex align-items-center gap-2 px-3 py-2" style="border-bottom:1px solid #f0f4f2;">'
                        + '  <span class="rank-badge ' + rankCls + '">' + (idx + 1) + '</span>'
                        + '  <div style="flex:1;min-width:0;">'
                        + '    <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'
                        + CM.escapeHtml(h.itemName) + '</div>'
                        + '    <div style="font-size:11px;color:#8ba09a;">' + CM.escapeHtml(h.categoryName || '') + '</div>'
                        + '  </div>'
                        + '  <span class="tag">热度 ' + (h.hotScore || 0) + '</span>'
                        + '</div>';
                });
                html += '</div>';
                $('#hotList').html(html);
            });
        }

        /* ================= 下单弹窗 ================= */
        $('#itemGrid').on('click', '[data-book]', function () {
            var id = Number($(this).data('book'));
            CM.get('/api/common/items/' + id).then(function (it) {
                $('#mServiceId').val(it.id);
                $('#mItemName').text(it.itemName);
                $('#mItemSkill').text('所需技能：' + ((it.skillTagsList || []).join('、') || '无'));
                $('#mItemPrice').html('¥' + CM.money(it.price) + '<small>/' + CM.escapeHtml(it.unit || '次') + '</small>');
                // 预填资料：地址与电话取当前账号，减少重复输入
                if (me) {
                    $('#mAddress').val(me.address || '');
                    $('#mPhone').val(me.phone || '');
                }
                var min = CM.minAppointTime();
                $('#mAppointTime').attr('min', min).val(min);
                orderModal.show();
            });
        });

        $('#submitOrderBtn').on('click', function () {
            var appoint = $('#mAppointTime').val();
            var address = $.trim($('#mAddress').val());
            var phone = $.trim($('#mPhone').val());
            if (!appoint || !address || !phone) {
                CM.toast('请完整填写上门时间、地址与联系电话', 'error');
                return;
            }
            // 11 位手机号前端先挡一道，后端仍会做长度与必填校验
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                CM.toast('联系电话格式不正确（11 位手机号）', 'error');
                return;
            }
            var payload = {
                serviceId: Number($('#mServiceId').val()),
                appointTime: appoint.length === 16 ? appoint + ':00' : appoint,
                serviceAddress: address,
                contactPhone: phone,
                remark: $.trim($('#mRemark').val())
            };
            var $btn = $(this).prop('disabled', true).html('提交中…');
            CM.post('/api/resident/order', payload)
                .then(function () {
                    orderModal.hide();
                    CM.toast('预约提交成功，正在跳转到我的预约…', 'success');
                    setTimeout(function () {
                        window.location.href = '/resident/orders';
                    }, 900);
                })
                .catch(function () {
                    // 错误提示已由 api.js 统一弹出（含限流 400 的文案）
                })
                .finally(function () {
                    $btn.prop('disabled', false).html('<i class="bi bi-check2-circle"></i> 提交预约');
                });
        });

        /* ================= 初始化 ================= */
        CM.loadMe().then(function (user) {
            me = user;
            return Promise.all([loadCategories(), loadItems(), loadHot()]);
        }).catch(function () {
            // 未登录由 api.js 跳登录页
        });
    });
</script>
</body>
</html>
